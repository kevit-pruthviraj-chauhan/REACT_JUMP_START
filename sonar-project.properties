# Project Key & Name
# Placeholder values for generalized setup
sonar.projectKey=<project_key>
sonar.projectName=<project_name>

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

# Source files (CRA layout)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclude generated / non-source files from analysis
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.d.ts,src/setupTests.*,src/reportWebVitals.*

# Coverage report (produced by: yarn test --coverage --watchAll=false)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
