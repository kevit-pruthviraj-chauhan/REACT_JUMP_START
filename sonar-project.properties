# Project Key & Name
# Placeholder values for generalized setup
sonar.projectKey=<project_key>
sonar.projectName=<project_name>

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

# Source files location
sonar.sources=.

# Ignore files
# Excluding node_modules and build directory (CRA uses 'build', not 'dist')
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.test.tsx,**/*.test.ts,**/*.spec.ts
